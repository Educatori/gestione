<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione — Campus Hub</title>

    <!-- ===== FAVICON ===== -->
    <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
    <link rel="icon" href="favicon.ico" sizes="any" type="image/x-icon">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="attiv.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(79,142,247,0.12), transparent),
                radial-gradient(ellipse 60% 40% at 80% 110%, rgba(56,217,169,0.07), transparent);
        }

        .header-container {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 1.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-2);
            font-family: var(--font-mono);
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            max-width: 720px;
            width: 100%;
        }

        .admin-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 16px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 130px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .admin-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--border-2);
            background: var(--surface-2);
        }
        .admin-card svg {
            width: 32px; height: 32px;
            stroke: var(--accent);
            stroke-width: 1.6;
            fill: none;
            transition: stroke 0.2s;
        }
        .admin-card:hover svg { stroke: var(--accent-2); }
        .admin-card span {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-2);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-align: center;
        }
        .admin-card:hover span { color: var(--text); }

        .back-link {
            margin-top: 36px;
            font-size: 0.72rem;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .back-link:hover { color: var(--accent); }
    </style>
</head>
<body>

    <div class="header-container">
        <h1><a href="educatori.github.io/campus/index.html">• Gestione •</a></h1>
        <div class="subtitle">Strumenti amministrativi</div>
    </div>

    <div class="admin-grid">

        <a href="https://educatori.github.io/gestione/attivicampus.html" class="admin-card">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 4h12v16H6z"/>
                <path d="M9 8h6"/>
                <path d="M9 12h6"/>
                <path d="M9 16h4"/>
            </svg>
            <span>Attività</span>
        </a>
        
        <a href="https://educatori.github.io/gestione/gestione-permessi.html" class="admin-card">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/>
            </svg>
            <span>Permessi</span>
        </a>

        <a href="https://educatori.github.io/gestione/gestione-studenti.html" class="admin-card">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="8" r="4"/>
                <path d="M2 21c0-4 3-7 7-7s7 3 7 7"/>
                <circle cx="17" cy="8" r="3"/>
                <path d="M17 14c2.5 0 4.5 2 4.5 4.5"/>
            </svg>
            <span>Studenti</span>
        </a>
        
        
        <!-- Qui aggiungerai in futuro le altre card, es.: -->
        <!--
        <a href="gestione-turni.html" class="admin-card">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 7v5l3 2"/>
            </svg>
            <span>Turni</span>
        </a>
        -->

    </div>

</body>
</html>
