<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione — Campus Hub</title>

    <!-- ===== FAVICON ===== -->
    <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
    <link rel="icon" href="favicon.ico" sizes="any" type="image/x-icon">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="gest.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(79,142,247,0.12), transparent),
                radial-gradient(ellipse 60% 40% at 80% 110%, rgba(56,217,169,0.07), transparent);
        }

        .header-container {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 1.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-2);
            font-family: var(--font-mono);
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(2, 145px);
            gap: 18px;
            justify-content: center;
            width: 100%;
        }

        .admin-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            height: 145px;
            width: 145px;
            box-shadow: var(--shadow-sm);
            transition: all 0.35s cubic-bezier(.25,.8,.25,1);
            position: relative;
            overflow: hidden;
        }
        .admin-card:hover {
            transform: translateY(-8px) scale(1.04);
            box-shadow: var(--shadow-lg);
            border-color: var(--border-2);
            background: var(--surface-2);
        }
                /* Shimmer effect */
        .admin-card::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(120deg, transparent, rgba(79,142,247,0.08), transparent);
            transform: rotate(25deg);
            top: -100%;
            left: -100%;
            transition: 0.6s;
        }
        .admin-card:hover::before { top: 100%; left: 100%; }

        /* Accent border bottom */
        .admin-card::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .admin-card:hover::after { opacity: 1; }

        .admin-card:active { transform: scale(0.97); }
        
            .admin-card svg {
            width: 38px;
            height: 38px;
            stroke: var(--accent);
            stroke-width: 1.6;
            fill: none;
            transition: all 0.3s;
            filter: drop-shadow(0 0 8px rgba(79,142,247,0.3));
            position: relative;
            z-index: 1;
        }
        .admin-card:hover svg {
            stroke: var(--accent-2);
            filter: drop-shadow(0 0 12px rgba(56,217,169,0.45));
        }
        .admin-card span {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: color 0.2s;
            position: relative;
            z-index: 1;
        }
        .admin-card:hover span { color: var(--text); }

        .back-link {
            margin-top: 36px;
            font-size: 0.72rem;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .back-link:hover { color: var(--accent); }
    </style>
</head>
<body>

    <div class="header-container">
        <h1><a href="../campus/index.html">• Gestione •</a></h1>
        <div class="subtitle">Strumenti amministrativi</div>
    </div>

    <div class="admin-grid">

        <a href="../attivita/attivicampus.html" class="admin-card">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 4h12v16H6z"/>
                <path d="M9 8h6"/>
                <path d="M9 12h6"/>
                <path d="M9 16h4"/>
            </svg>
            <span>Attività</span>
        </a>
        
                <a href="../gestione/gestione-permessi.html" class="admin-card">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"/>
                <path d="M8 12h13"/>
                <path d="M16 7l5 5-5 5"/>
            </svg>
            <span>Permessi</span>
        </a>

        <a href="../gestione/gestione-studenti.html" class="admin-card">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="8" r="4"/>
                <path d="M2 21c0-4 3-7 7-7s7 3 7 7"/>
                <circle cx="17" cy="8" r="3"/>
                <path d="M17 14c2.5 0 4.5 2 4.5 4.5"/>
            </svg>
            <span>Studenti</span>
        </a>
        
        <a href="../campus/storico.html" class="admin-card">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9"/>
                <path d="M3 4v5h5"/>
                <path d="M12 7v5l3 2"/>
            </svg>
            <span>Storico</span>
        </a>

            </svg>
            <span>Turni</span>
        </a>
        -->

    </div>

</body>
</html>
